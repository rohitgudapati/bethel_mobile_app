name: bethelprayerhouse
description: "Bethel Prayer House – church app (Naperville, IL)."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  url_launcher: ^6.3.1
  firebase_core: ^5.2.0
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  youtube_player_iframe: ^6.0.4
  smart_auth: ^4.0.0
  flutter_svg: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/songs/
    - assets/church/
  fonts:
    # Display serif for headings (BethelFonts.display). Playfair Display stands in for
    # Domaine Display, which is a licensed font: once the church has a licence, put the
    # Domaine Display files in this folder and point these three entries at them.
    - family: Display
      fonts:
        - asset: assets/fonts/DisplaySerif/PlayfairDisplay-500.ttf
          weight: 500
        - asset: assets/fonts/DisplaySerif/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/DisplaySerif/PlayfairDisplay-700.ttf
          weight: 700
        - asset: assets/fonts/DisplaySerif/PlayfairDisplay-500-Italic.ttf
          weight: 500
          style: italic
    # Welcome screen. Git-ignored (licence); see assets/fonts/Switzer/README.md to download.
    - family: Switzer
      fonts:
        - asset: assets/fonts/Switzer/Switzer-Regular.ttf
          weight: 400
        - asset: assets/fonts/Switzer/Switzer-Medium.ttf
          weight: 500
        - asset: assets/fonts/Switzer/Switzer-Semibold.ttf
          weight: 600
    - family: Quintessential
      fonts:
        - asset: assets/fonts/Quintessential/Quintessential-Regular.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu/NotoSansTelugu-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTelugu/NotoSansTelugu-SemiBold.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
